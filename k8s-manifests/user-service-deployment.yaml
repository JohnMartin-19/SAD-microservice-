apiVersion: apps/v1
kind: Deployment
metadata:
  name: m-farm-user-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: m-farm-user-service
  template:
    metadata:
      labels:
        app: m-farm-user-service
    spec:
      # Define the initContainer for database migrations
      initContainers:
        - name: migrate-user-db
          # Use the same application image for running migrations
          image: 740857577909.dkr.ecr.us-east-1.amazonaws.com/m-farm-user-service:latest
          # The command to run Django migrations
          command: ["python3", "manage.py", "migrate"]
          env:
            # Pass database connection details as environment variables
            # Use valueFrom.secretKeyRef to securely pull from the new Kubernetes Secret
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mfarm-accounts-db-secret # Name of the Kubernetes Secret for user-service
                  key: db_name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mfarm-accounts-db-secret
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mfarm-accounts-db-secret
                  key: db_password
            - name: DB_HOST
              # IMPORTANT: Replace with the actual hostname of your PostgreSQL RDS instance
              value: "m-farm-accounts.cq32e02eaaeq.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432" # Default PostgreSQL port, adjust if yours is different
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "200Mi"

      containers:
      - name: m-farm-user-service
        image: 740857577909.dkr.ecr.us-east-1.amazonaws.com/m-farm-user-service:latest
        ports:
        - containerPort: 8080 # <--- ADJUST THIS PORT if user-service uses a different one
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
            # Also pass database connection details to the main application container for runtime
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mfarm-accounts-db-secret # Name of the Kubernetes Secret for user-service
                  key: db_name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mfarm-accounts-db-secret
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mfarm-accounts-db-secret
                  key: db_password
            - name: DB_HOST
              # IMPORTANT: Replace with the actual hostname of your PostgreSQL RDS instance
              value: "m-farm-accounts.cq32e02eaaeq.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432" # Default PostgreSQL port, adjust if yours is different
        livenessProbe:
          httpGet:
            path: /health
            port: 8080 # <--- ADJUST THIS PORT
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080 # <--- ADJUST THIS PORT
          initialDelaySeconds: 5
          periodSeconds: 5