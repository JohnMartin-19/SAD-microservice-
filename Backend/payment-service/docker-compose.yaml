version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: os.getenv("DB_NAME")
      POSTGRES_USER: os.getenv("DB_USERNAME")
      POSTGRES_PASSWORD: os.getenv("DB_PASSWORD")
    ports:
      - "5432:5432"
  
  web:
    build: .
    command: sh -c "python3 manage.py migrate && python3 manage.py runserver"
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - db

    environment:
      - DB_HOST=db
      


