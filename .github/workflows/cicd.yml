
name: CI/CD Pipeline for M-FARM

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::740857577909:role/github-workflow
          aws-region: us-east-1

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build, tag, and push Frontend (m-farm)
      - name: Build and push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: m-farm-m-farm-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd Frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Build, tag, and push Backend services
      - name: Build and push Backend - product-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: m-farm-m-farm-product-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd Backend/main-app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build and push Backend - user-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: m-farm-m-farm-user-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd Backend/user-service
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build and push Backend - payment-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: m-farm-m-farm-payment-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd Backend/payment-service
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Set up kubectl for EKS
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Update kubeconfig for EKS cluster
      # Update kubeconfig for EKS cluster (with debug)
      - name: Configure kubectl
        run: |
          kubectl version --client
          echo "Attempting aws eks update-kubeconfig..."
          # Run with debug output for aws cli
          aws eks update-kubeconfig --region us-east-1 --name m-farm-cluster --debug 2>&1 | tee aws-kubeconfig-debug.log
          echo "aws eks update-kubeconfig command finished."
          cat aws-kubeconfig-debug.log

          echo "--- Kubeconfig Contexts (after update-kubeconfig) ---"
          kubectl config get-contexts 2>&1 | tee kubectl-contexts.log
          cat kubectl-contexts.log

          echo "--- Kubeconfig View (after update-kubeconfig) ---"
          kubectl config view 2>&1 | tee kubectl-view.log
          cat kubectl-view.log

          echo "--- Cluster Info (testing API connectivity) ---"
          # This command might fail, but its output is crucial
          kubectl cluster-info 2>&1 | tee kubectl-cluster-info.log
          cat kubectl-cluster-info.log

          echo "--- Auth Can I (testing specific permissions) ---"
          # These commands will directly tell us if the assumed role has permissions
          kubectl auth can-i get pods --namespace default 2>&1 | tee kubectl-can-i-pods.log
          cat kubectl-can-i-pods.log
          kubectl auth can-i create deployments --namespace default 2>&1 | tee kubectl-can-i-deployments.log
          cat kubectl-can-i-deployments.log

          echo "--- Attempting kubectl apply in next step ---"
          # kubectl apply command is in the next step

      # Apply Kubernetes manifests
      - name: Deploy to EKS
        run: |
          rm -rf ~/.kube/cache ~/.kube/http-cache
          kubectl config current-context
          kubectl apply -f k8s-manifests/ 